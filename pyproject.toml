[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ghidra-mcp"
dynamic = ["version"]
description = "Single-process MCP server for headless Ghidra automation"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "pyghidra>=3.0,<4",
]

[project.scripts]
ghidra-mcp = "ghidra_mcp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_mcp"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires a real Ghidra installation and generated ELF fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
